# SUPER publishes direct position/velocity feedback gains kx=[5.7, 5.7, 4.2]
# and kv=[3.4, 3.4, 4.0]. The shared SE3 controller is cascaded, so use
# kp_v=kv and kp_p=kx/kv to preserve the same translational feedback law.
kp_px: 1.6764705882352942
kp_py: 1.6764705882352942
kp_pz: 1.05
kp_vx: 3.4
kp_vy: 3.4
kp_vz: 4.0

# SUPER's advertised translational feedback law contains only kx and kv.
# The common controller's legacy position-error derivative term is useful for
# slower setpoints, but with SUPER's ~100 Hz command stream and ~30 Hz odometry
# it differentiates two asynchronous sample-and-hold signals.  That produced
# 16--21 degree attitude-setpoint jumps every controller tick in the forest
# regression.  Disable only that extra term for this plugin so the cascaded
# controller remains exactly equivalent to SUPER's native kx/kv law.
kd_px: 0.0
kd_py: 0.0
kd_pz: 0.0

# The controller now consumes /localization/odom in FAST-LIO's arbitrary world
# frame.  Keep the shared, latched IMU-to-world alignment enabled.  It is
# captured once before raw attitude control and is not recomputed from
# asynchronous latest samples, so the old sample-and-hold jump no longer
# applies.
align_attitude_with_imu: true

# Preserve all of SUPER's configured 3.0 m/s^2 feed-forward acceleration.
max_feedforward_acc: 3.0
