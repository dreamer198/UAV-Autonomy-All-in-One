api_version: sim2real.planner/v1
id: diff
ros_namespace: diff
display_name: Diff Planner
variant: diff
adapter_node: adapter
workspace_setup: planning/workspaces/diff_ws/devel/setup.bash
launch:
  package: sim2real_diff_adapter
  file: diff_backend.launch
  arguments:
    backend_id: diff
    profile: local
    scene: room
    odom_topic: /localization/odom
    cloud_topic: /localization/cloud_registered
default_profile: local
profiles:
  - local
timeouts:
  startup_sec: 20.0
  status_sec: 0.5
  command_sec: 0.08
rates:
  status_min_hz: 5.0
  command_min_hz: 80.0
capabilities:
  simulation: true
  yaw: true
  cancel: true
  goal_validation: true
  rviz: true
