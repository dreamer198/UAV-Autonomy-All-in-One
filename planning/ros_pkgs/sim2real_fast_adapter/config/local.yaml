sdf_map:
  resolution: 0.1
  # Single fixed-map configuration shared by Fast Kino and Fast Topo. Keep the
  # native centered-map convention and a 0.1 m voxel size: 300 x 300 x 50 is
  # 4.5 million voxels, close to the former local map and below the 512 MiB
  # allocation guard.
  origin_x: -15.0
  origin_y: -15.0
  origin_z: -1.0
  map_size_x: 30.0
  map_size_y: 30.0
  map_size_z: 5.0
  local_update_range_x: 5.5
  local_update_range_y: 5.5
  # Match the native Fast-Planner demo so a vehicle hovering above the floor
  # still integrates ground returns instead of treating the space below it as
  # free.
  local_update_range_z: 4.5

adapter:
  # The native depth demo sees a dense ground plane. The migrated Mid-360
  # input is sparse, so add an adapter-private floor alongside the accumulated
  # plugin-private static occupancy map.
  inject_virtual_floor: true
  virtual_floor_height: 0.2
