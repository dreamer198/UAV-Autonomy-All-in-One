# forest 仿真专用地图几何覆盖。launch 会先加载 ../planner.yaml，再加载本文件，
# 因此这里只写随场景改变的范围和分辨率；规划、动力学和 adapter 参数仍使用共享值。
#
# 场景重建物边界约为 x=[-0.12, 61.65]、y=[-19.03, -0.04]。地图在其外侧保留
# 至少一个 5.5 m 的局部更新半宽及障碍膨胀余量，避免靠近树林边缘时无法更新 ESDF。
sdf_map:
  resolution: 0.2                   # forest 体素边长；比 room 粗，以较低内存覆盖长条树林。
  origin_x: -6.0                   # forest 地图 x 最小值，对应最大值 68。
  origin_y: -25.0                  # forest 地图 y 最小值，对应最大值 6。
  origin_z: -1.0                   # forest 地图 z 最小值，对应最大值 4。
  map_size_x: 74.0                 # forest 地图 x 方向长度，覆盖场景及两端局部更新余量。
  map_size_y: 31.0                 # forest 地图 y 方向长度，覆盖场景及两侧局部更新余量。
  map_size_z: 5.0                  # forest 地图 z 方向长度；与共享虚拟天花板配置匹配。
