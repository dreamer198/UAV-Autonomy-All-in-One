# 仿真和真机共用的算法与安全参数。随后加载的载体配置可覆盖同名项。
enable_sim: false
auto_request_offboard: false
auto_request_arm: false
auto_land_on_geofence: false
enable_thrust_estimation: false
use_acceleration_feedforward: true
use_yaw_rate_feedforward: true
# FAST-LIO world has an arbitrary startup heading. Latch its attitude relation
# to the FCU IMU before the first raw-attitude handoff.
align_attitude_with_imu: true
max_feedforward_acc: 1.2

# The planner and SE3 feedback must use the same FAST-LIO world frame.  MAVROS
# local odometry is a separate PX4 earth-aligned frame and is used only for the
# native local-position OFFBOARD hold before a planner trajectory is accepted.
odometry_topic: /localization/odom
local_odometry_topic: /mavros/local_position/odom
# Blend the first raw-attitude command from the current measured attitude so
# switching away from PX4 local-position control is bumpless.
attitude_handoff_duration: 1.5
# If the live IMU-to-FAST-LIO frame relation changes after it is latched, do
# not rotate commands to follow the reset. Exit the raw-attitude handoff.
max_attitude_alignment_error_deg: 10.0

# 同时检查回调接收时间；消息时间戳非零时也检查源时间。
odom_timeout: 0.2
imu_timeout: 0.2
state_timeout: 2.0
# The gateway and every backend publish at >=80 Hz. If that stream disappears,
# discard any moving velocity/acceleration setpoint within 80 ms.
trajectory_command_timeout: 0.08
command_publisher_node: /planner_gateway

# 里程计或 IMU 失效且状态仍可信时，停止控制输出并限频请求 AUTO.LOITER。
# 状态本身失效时只停止输出，由 PX4 的 OFFBOARD-loss failsafe 接管。
land_retry_interval: 1.0
safety_hold_retry_interval: 1.0
