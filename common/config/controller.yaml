# 仿真和真机共用的算法与安全参数。随后加载的载体配置可覆盖同名项。
enable_sim: false
auto_request_offboard: false
auto_request_arm: false
auto_land_on_geofence: false
enable_thrust_estimation: false
use_acceleration_feedforward: true
use_yaw_rate_feedforward: true
max_feedforward_acc: 1.2

# 同时检查回调接收时间；消息时间戳非零时也检查源时间。
odom_timeout: 0.2
imu_timeout: 0.2
state_timeout: 2.0

# 里程计或 IMU 失效且状态仍可信时，停止控制输出并限频请求 AUTO.LOITER。
# 状态本身失效时只停止输出，由 PX4 的 OFFBOARD-loss failsafe 接管。
land_retry_interval: 1.0
safety_hold_retry_interval: 1.0
