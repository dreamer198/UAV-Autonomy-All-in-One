# Real-vehicle-specific SE3 control and safety parameters. This file includes
# a measured hover-thrust calibration, but it does not define mass, inertia,
# motor models, sensor calibration, or PX4 inner-loop gains. Planner parameters
# belong to the selected planner plugin and must not be duplicated here.
enable_sim: false
hover_percent: 0.50
max_hover_percent: 0.95
min_output_thrust: 0.20
max_output_thrust: 1.00
geo_fence:
  x: 50.0
  y: 50.0
  z: 3.0
ki_pz: 0.30
int_limit_z: 5.0
