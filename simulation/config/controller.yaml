# PX4 SITL iris_mid360 的机体标定。Planner 参数统一维护在
# sim2real_common/config/planner.yaml，不放在本文件中。

# 启用仿真专用控制路径。公共 controller.yaml 仍禁止自动 OFFBOARD 和解锁，
# 并以 odom_timeout=0.2 s 判断 MAVROS 里程计是否新鲜。必须显式执行
# ./launch/sim.sh arm；脚本完成 PX4 原生起飞后才自动交接到 OFFBOARD。
enable_sim: true

# 模拟 Iris 抵消重力、保持悬停所需的归一化总推力；这是最主要的机体标定值。
hover_percent: 0.755

# 在线推力估计允许的最大悬停推力。公共配置关闭了推力估计，当前不会在线调整。
max_hover_percent: 0.85

# SE3 在已解锁且处于 OFFBOARD 时发送的归一化推力上下限。
min_output_thrust: 0.20
max_output_thrust: 0.95

# 软件围栏：x/y 为正负对称边界，z 为高度上限。公共配置关闭自动降落，
# 超出围栏时当前只记录警告。
geo_fence:
  x: 50.0
  y: 50.0
  z: 6.0

# 高度位置积分增益；设为 0 表示仿真中关闭积分高度补偿。
ki_pz: 0.0

# 高度累计误差限幅；ki_pz 为 0 时不会影响控制输出。
int_limit_z: 5.0
